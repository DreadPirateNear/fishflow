services:
  fishflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/dreadpiratenear/fishflow:v1.1.0
    container_name: fishflow
    restart: unless-stopped
    ports:
      - "${FISHFLOW_PORT:-8080}:8080"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
